llm:
  provider: openapi
  url: https://openrouter.ai/api/v1
  token: ""
  model: qwen/qwen3.7-flash
  embed_model: bge-m3
  request_timeout_minutes: 20
  retry_delays_seconds: [60, 120, 300]
  max_bytes: 25000
  max_embed_bytes: 63768

semantic:
  mode: fast
  description_language: ru
  concurrency:
    semantic_workers: 6
  throttling:
    delay_ms: 10
    adaptive: true

exclude:
  - "dist/**"
  - "sample-project/**"
  - "_llm_mod.znt/**"
  - "docs/**"
  - ".github/**"
  - "present/**"
  - "tests/**"
  - ".git/**"
  - ".vscode/**"
  - ".idea/**"

languages:
  csharp:
    include: []
    exclude:
      - "obj/**"
      - "bin/**"
    entrypoints:
      - "Program.cs"
    dependency_dirs:
      - "Packages/**"
  php:
    include:
      - "app/**"
      - "src/**"
    exclude:
      - "vendor/**"
      - "storage/**"
      - "cache/**"
    entrypoints:
      - "public/index.php"
      - "artisan"
    dependency_dirs:
      - "vendor/**"
  go:
    include: []
    exclude:
      - "vendor/**"
    entrypoints:
      - "main.go"
      - "cmd/**/main.go"
    dependency_dirs:
      - "vendor/**"
  javascript:
    include: []
    exclude:
      - "node_modules/**"
      - "dist/**"
      - ".nuxt/**"
      - ".next/**"
      - "build/**"
      - "public/build/**"
      - "**/*.min.js"
      - "**/wwwroot/lib/**"
    entrypoints:
      - "index.js"
      - "src/main.js"
      - "src/main.ts"
    dependency_dirs:
      - "node_modules/**"
  java:
    include: []
    exclude:
      - "target/**"
      - "build/**"
      - "out/**"
      - "bin/**"
      - ".gradle/**"
      - ".idea/**"
    entrypoints:
      - "src/main/java/**/Main.java"
      - "src/main/java/**/Application.java"
    dependency_dirs: []
  python:
    include: []
    exclude:
      - "**/__pycache__/**"
      - "**/.pytest_cache/**"
      - "**/.venv/**"
      - "**/venv/**"
      - "**/.git/**"
    entrypoints:
      - "main.py"
      - "app.py"
      - "run.py"
    dependency_dirs: []
  resource:
    include: []
    exclude:
      - "vendor/**"
      - "node_modules/**"
    entrypoints: []
    dependency_dirs: []
